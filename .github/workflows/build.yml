name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run check

  browser-pixels:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - run: npm ci
      - name: Locate system Edge
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path -LiteralPath $edge))
          {
            throw "Required system Edge was not found: $edge"
          }
          "BACLICKFX_CHROMIUM_PATH=$edge" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run Chromium pixel regression
        run: npm run test:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-pixel-failure
          path: test-results/browser-pixels
          if-no-files-found: ignore
