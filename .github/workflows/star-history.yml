name: Star History

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only execute the writer from the reviewed default branch.
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Checkout history
        uses: actions/checkout@v7
        with:
          ref: star-history
          path: history
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Sync history branch
        working-directory: history
        run: git pull --rebase origin star-history

      - name: Update Star history
        working-directory: source
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-star-history.mjs --data-dir ../history

      - name: Commit and push
        working-directory: history
        shell: bash
        run: |
          git add -- README.md stars.csv star-history.svg

          if git diff --cached --quiet
          then
            echo "Star history is unchanged."
            exit 0
          fi

          record_date="$(tail -n 1 stars.csv | cut -d, -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "记录 ${record_date} Star 数量"

          # Rebase once more so a concurrent maintainer update fails safely.
          git pull --rebase origin star-history
          git push origin HEAD:refs/heads/star-history
