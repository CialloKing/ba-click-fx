<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>OffscreenCanvas Worker fixture</title>
  <style>
    html,
    body
    {
      margin: 0;
      background: #000;
    }

    #stage
    {
      display: block;
      width: 320px;
      height: 240px;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="stage" width="320" height="240"></canvas>
  <script type="module">
    const stage = document.getElementById('stage');
    const worker = new Worker(
      new URL('./offscreen-worker-fixture.js', import.meta.url),
      { type: 'module' },
    );
    const pending = new Map();
    let nextRequestId = 1;

    worker.addEventListener('message', (event) =>
    {
      const request = pending.get(event.data.id);

      if (!request)
      {
        return;
      }

      pending.delete(event.data.id);
      if (event.data.ok)
      {
        request.resolve(event.data.result);
      }
      else
      {
        request.reject(new Error(event.data.error));
      }
    });
    worker.addEventListener('error', (event) =>
    {
      const error = new Error(event.message || 'Worker failed');

      for (const request of pending.values())
      {
        request.reject(error);
      }
      pending.clear();
    });

    function request(type, payload = {}, transfer = [])
    {
      const id = nextRequestId++;
      const promise = new Promise((resolve, reject) =>
      {
        pending.set(id, { resolve, reject });
      });

      worker.postMessage({ id, type, payload }, transfer);
      return promise;
    }

    const offscreen = stage.transferControlToOffscreen();

    window.offscreenWorkerTest =
    {
      request,
      resize(width, height, dpr)
      {
        stage.style.width = `${width}px`;
        stage.style.height = `${height}px`;
        return request('resize', { width, height, dpr });
      },
      terminate()
      {
        worker.terminate();
      },
    };
    window.offscreenWorkerReady = request(
      'init',
      {
        canvas: offscreen,
        width: 320,
        height: 240,
        dpr: 1,
      },
      [offscreen],
    );
  </script>
</body>
</html>
